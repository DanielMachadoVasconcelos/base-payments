plugins {
	id 'java'
	id 'idea'
	id 'jacoco'

	id 'org.springframework.boot' version '4.0.6'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.ead.payments'
version = '0.0.1-SNAPSHOT'

tasks.withType(JavaCompile) {
	options.compilerArgs += '--enable-preview'
}

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
	maven { url 'https://repo.spring.io/milestone' }
	maven { url 'https://repo.spring.io/snapshot' }
	maven { url 'https://repo.spring.io/release' }
}

ext {
	set('springModulithVersion', "2.0.6")
	set('springCloudVersion', "2025.1.1")
	set('flyway.version', "12.6.2")
	set('opentelemetry.version', "1.62.0")
}

dependencies {

	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.cloud:spring-cloud-starter-netflix-eureka-client'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	// Spring Boot 4 still uses the AspectJ starter to activate @Observed weaving.
	implementation 'org.springframework.boot:spring-boot-starter-aspectj'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-kafka'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-opentelemetry'
	implementation 'org.springframework.retry:spring-retry'

	implementation 'org.springframework.modulith:spring-modulith-events-kafka'
	implementation 'org.springframework.modulith:spring-modulith-events-api'
	implementation 'org.springframework.modulith:spring-modulith-starter-core'
	implementation 'org.springframework.modulith:spring-modulith-starter-jpa'

	implementation 'org.springframework.boot:spring-boot-starter-flyway'
	implementation 'org.flywaydb:flyway-database-postgresql:12.6.2'

	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	implementation 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	developmentOnly 'org.springframework.boot:spring-boot-docker-compose'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

	runtimeOnly 'org.postgresql:postgresql:42.7.11'

	annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'
	// Keep the logback appender aligned with its OpenTelemetry API line.
	implementation 'io.opentelemetry.instrumentation:opentelemetry-logback-appender-1.0:2.28.1-alpha'

	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'
	implementation 'org.mapstruct:mapstruct:1.6.3'

	testImplementation 'org.wiremock.integrations:wiremock-spring-boot:4.2.1'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testImplementation 'org.springframework.boot:spring-boot-docker-compose'
	testImplementation 'org.springframework.modulith:spring-modulith-starter-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-security-test'

	testImplementation 'com.tngtech.archunit:archunit-junit5:1.4.2'
	testImplementation 'com.tngtech.archunit:archunit-junit5-api:1.4.2'
	testImplementation 'com.tngtech.archunit:archunit:1.4.2'

	testAnnotationProcessor 'org.projectlombok:lombok'

	implementation 'com.google.guava:guava:33.6.0-jre'
	implementation 'org.apache.commons:commons-collections4:4.5.0'
	implementation 'org.apache.commons:commons-lang3:3.20.0'

}

dependencyManagement {
	imports {
		mavenBom "org.springframework.modulith:spring-modulith-bom:${springModulithVersion}"
		mavenBom "org.springframework.cloud:spring-cloud-dependencies:${springCloudVersion}"
	}
}

test {
	jvmArgs += '--enable-preview'

	useJUnitPlatform()
	testLogging {
		events "skipped", "failed"
        showExceptions = true
        showCauses = true
        showStackTraces = true
        showStandardStreams = true

	}

	maxParallelForks = 1
    finalizedBy jacocoTestReport
}

jacocoTestReport {
	dependsOn test
	reports {
		html.required = true
		xml.required = true
		csv.required = true
	}
	afterEvaluate {
		classDirectories.setFrom(files(classDirectories.files.collect {
			fileTree(dir: it, exclude: '**/generated/**')
		}))
	}
}
